name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Check source tree and release version
        run: |
          $binaries = git ls-files -- '*.exe' '*.msi' '*.apk' '*.aab' '*.zip' '*.dll' '*.pyd'
          if ($binaries) { throw 'Generated binaries must not be committed to the source repository.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            & python scripts/changelog.py guard --tag $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Release guard failed.' }
          }
      - name: Enable Yarn
        run: corepack enable
      - name: Build Windows packages
        run: ./scripts/build-desktop.ps1 -Zip
      - name: Check source and desktop runtime
        run: |
          & .venv/Scripts/python.exe -m ruff check app main.py scripts
          if ($LASTEXITCODE -ne 0) { throw 'Python checks failed.' }
          & .venv/Scripts/python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed.' }
          & .venv/Scripts/python.exe scripts/verify_upstream.py --local
          if ($LASTEXITCODE -ne 0) { throw 'Upstream source manifest checks failed.' }
          Push-Location frontend
          try {
            yarn lint
            if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed.' }
            yarn test
            if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          } finally { Pop-Location }
          & .venv/Scripts/python.exe scripts/verify-desktop.py frontend/out/win-unpacked
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime checks failed.' }
      - name: Write checksums
        run: |
          $packages = Get-ChildItem frontend/out -File | Where-Object { $_.Extension -in '.zip', '.exe' }
          if ($packages.Count -ne 2) { throw 'Expected one ZIP and one portable EXE.' }
          # 资产名必须与 Android 流水线区分：Release 内资产名唯一，同名 --clobber 会互相覆盖。
          $packages | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content frontend/out/SHA256SUMS-windows-x64.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BMT-windows-x64
          path: |
            frontend/out/*.zip
            frontend/out/*.exe
            frontend/out/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh release view` 在 Release 不存在时返回非零，这是预期分支；不能让它升级成终止错误。
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          # 预发布（0.2.0-beta.1）标成 prerelease 且不抢 latest，正式版的“最新版本”不受影响。
          $releaseFlags = @()
          if ($version -match '-') { $releaseFlags = @('--prerelease', '--latest=false') }
          & .venv/Scripts/python.exe scripts/changelog.py release-note --version $version --output release-note.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not render the release note.' }

          $releaseId = (gh release view $tag --json id --jq .id 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $releaseId) {
            # Android 流水线可能同时触发同一 tag；创建失败后再确认一次，避免竞态直接失败。
            gh release create $tag --draft --verify-tag --title "BMT $tag" --notes-file release-note.md @releaseFlags
            $releaseId = (gh release view $tag --json id --jq .id 2>&1 | Out-String).Trim()
            if (-not $releaseId) { throw 'Could not create the draft release.' }
          }

          $isDraft = (gh release view $tag --json isDraft --jq .isDraft 2>&1 | Out-String).Trim()
          $assetNames = (gh release view $tag --json assets --jq '.assets[].name' 2>&1 | Out-String)
          # 已转正的版本只允许补资产，不允许覆盖；Windows 产物已存在即视为重复发版。
          if ($isDraft -ne 'true' -and $assetNames -match 'windows-x64') {
            throw 'This version is already published. Use a new version tag.'
          }
          $uploads = Get-ChildItem frontend/out -File | Where-Object { $_.Extension -in '.zip', '.exe' -or $_.Name -eq 'SHA256SUMS-windows-x64.txt' }
          gh release upload $tag @($uploads.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; the release remains a draft.' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

name: Finalize Release

on:
  workflow_run:
    workflows: ['Windows Release', 'Android Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: '已成功的标签构建 Run ID（用于重试公开，不重建安装包）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finalize-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Resolve the verified build commit
        id: source
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq .head_sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Load release controls from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-tools
          sparse-checkout: scripts/finalize-release.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publish only after both platform checks pass
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}
        run: python .release-tools/scripts/finalize-release.py

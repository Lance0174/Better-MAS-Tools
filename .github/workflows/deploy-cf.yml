name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'scripts/install-worker-deps.py'
      - 'scripts/prepare-worker.py'
      - 'deploy/worker/**'
      - 'docs/DEPLOYMENT.md'

permissions:
  contents: read

concurrency:
  group: deploy-cf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Enable Yarn
        run: corepack enable

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --immutable
          yarn build

      - name: Install worker dependencies
        run: |
          uv run --no-project --python 3.13 --with uv==0.12.12 python scripts/install-worker-deps.py

      - name: Prepare worker assets
        run: |
          uv run --no-project --python 3.13 python scripts/prepare-worker.py

      - name: Install wrangler
        working-directory: deploy/worker
        run: npm ci

      - name: Configure public origin
        working-directory: deploy/worker
        env:
          PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_PUBLIC_ORIGIN }}
        run: |
          if [ -z "$PUBLIC_ORIGIN" ]; then
            echo "::error::Set the CLOUDFLARE_PUBLIC_ORIGIN repository variable (e.g. https://community.example.com)"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const file = 'wrangler.jsonc';
            const text = fs.readFileSync(file, 'utf8');
            // 去掉行注释得到纯 JSON，设置 vars，再写回；保留其它配置结构。
            const strip = text.replace(/\/\/.*\$/gm, '').trim();
            const data = JSON.parse(strip);
            data.vars = Object.assign({}, data.vars, { COMMUNITY_PUBLIC_ORIGIN: process.env.PUBLIC_ORIGIN });
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
            console.log('wrangler.jsonc configured with public origin');
          "

      - name: Dry-run deploy
        working-directory: deploy/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --outdir .dry-run-out

      - name: Set secrets
        working-directory: deploy/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_PASSWORD: ${{ secrets.CLOUDFLARE_ACCESS_PASSWORD }}
          ENCRYPTION_KEY: ${{ secrets.CLOUDFLARE_ENCRYPTION_KEY }}
        run: |
          if [ -z "$ACCESS_PASSWORD" ] || [ -z "$ENCRYPTION_KEY" ]; then
            echo "::error::Set CLOUDFLARE_ACCESS_PASSWORD (>=12 chars) and CLOUDFLARE_ENCRYPTION_KEY (32-byte Base64) secrets"
            exit 1
          fi
          echo "$ACCESS_PASSWORD" | npx wrangler secret put COMMUNITY_ACCESS_PASSWORD
          echo "$ENCRYPTION_KEY" | npx wrangler secret put COMMUNITY_ENCRYPTION_KEY

      - name: Deploy to Cloudflare Workers
        working-directory: deploy/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

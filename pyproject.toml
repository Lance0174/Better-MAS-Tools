[project]
name = "better-mas-tools"
version = "0.2.0-beta.4"
description = "MAS 游戏社区扩展工具包"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi==0.162.5",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
  "httpx[socks]==0.28.1",
  "loguru==0.7.3",
  "pycryptodome==3.23.0",
  "pypinyin==0.55.0",
  "pywin32==310; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pillow==13.0.0",
    "pyinstaller>=6.16,<7",
    "pytest>=8,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.12,<1",
]

[project.optional-dependencies]
captcha = [
    "opencv-python-headless>=4.12,<5",
    "numpy>=2.2,<3",
    "pillow>=13,<14",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
# 只收集 tests/：local/ 下放的是临时探针和参考仓库的浅克隆，它们自带的用例
# 会连带跑起来，甚至在收集阶段 sys.exit 掉整个 pytest。
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["frontend", "local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
